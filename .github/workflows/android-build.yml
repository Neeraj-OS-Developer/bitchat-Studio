name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Least privilege: CI reads the repo only.
permissions:
  contents: read

# Cancel superseded runs on the same ref — safe for CI, saves minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global Gradle tuning applied to every Gradle invocation in every job.
env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # setup-gradle@v4:
      #   - replaces deprecated gradle/gradle-build-action@v2/v3
      #   - replaces the redundant actions/cache@v3 step
      #   - caches wrapper, ~/.gradle/caches, project .gradle
      #   - validate-wrappers: blocks tampered gradle-wrapper.jar
      - name: Setup Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Run lint even if tests failed — surface both signals in one pass.
      # Job still fails because the test step above failed.
      - name: Run lint
        if: always()
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          # Trailing /** is required — otherwise contents may be missed.
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30

    strategy:
      # Let both variants finish so a single CI pass reports both.
      fail-fast: false
      matrix:
        variant: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ${{ matrix.variant }} APK
        run: ./gradlew assemble${{ matrix.variant }} --stacktrace

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Step summary (APK listing)
        if: always()
        run: |
          {
            echo "### ${{ matrix.variant }} build"
            echo ""
            echo '```'
            find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; \
              || echo "(no APK produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
