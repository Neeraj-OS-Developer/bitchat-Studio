name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Triggers for tags like v1.0.0

# Default to least privilege; jobs elevate explicitly.
permissions:
  contents: read

# Serialize releases on the same ref to avoid two runs racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the release tag — used by BOTH jobs and by
# EVERY step that touches artifacts or release metadata.
#   - Tag push  -> use the pushed tag (e.g. v1.0.0)
#   - Manual    -> generate a unique tag (release-<run_number>)
# This is what makes `workflow_dispatch` work with action-gh-release.
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('release-{0}', github.run_number) }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APKs (with architecture splits)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files (pre-rename)
        run: |
          echo "=== APK files built (recursive) ==="
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; || true

      - name: Rename APKs for GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release

          echo "=== Directory before rename ==="
          ls -la

          # Matches both signed (`-release.apk`) and unsigned
          # (`-release-unsigned.apk`) Gradle outputs.
          rename_first_match() {
            local pattern="$1" dst="$2"
            local match
            match=$(find . -maxdepth 1 -type f -name "$pattern" | head -n1)
            if [ -n "$match" ]; then
              mv "$match" "$dst"
              echo "Renamed $match -> $dst"
            else
              echo "WARN: no file matched '$pattern'"
            fi
          }

          rename_first_match 'app-arm64-v8a-release*.apk' bitchat-android-arm64.apk
          rename_first_match 'app-x86_64-release*.apk'    bitchat-android-x86_64.apk
          rename_first_match 'app-universal-release*.apk' bitchat-android-universal.apk

          # Fallback: if Gradle produced a single (non-split) release APK,
          # treat it as the universal artifact.
          if [ ! -f bitchat-android-universal.apk ] && [ ! -f bitchat-android-arm64.apk ] && [ ! -f bitchat-android-x86_64.apk ]; then
            single=$(find . -maxdepth 1 -type f -name 'app-release*.apk' | head -n1)
            if [ -n "$single" ]; then
              mv "$single" bitchat-android-universal.apk
              echo "Single-APK fallback: renamed $single -> bitchat-android-universal.apk"
            fi
          fi

          echo "=== Directory after rename ==="
          ls -la

      # Optional: Sign APKs (uncomment and configure secrets when ready)
      # - name: Sign APKs
      #   uses: r0adkll/sign-android-release@v1
      #   with:
      #     releaseDirectory: app/build/outputs/apk/release
      #     signingKeyBase64: ${{ secrets.SIGNING_KEY }}
      #     alias: ${{ secrets.ALIAS }}
      #     keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-android-release-${{ env.RELEASE_TAG }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for softprops/action-gh-release

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitchat-android-release-${{ env.RELEASE_TAG }}
          path: release

      - name: Inspect downloaded artifact (diagnostic)
        run: |
          echo "=== Contents of release/ (recursive) ==="
          find release -type f -exec ls -lh {} \; || true

      - name: Prepare release metadata (dynamic)
        id: meta
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail

          # Discover APKs recursively — immune to whatever subpath the
          # upload/download round-trip produced.
          mapfile -t apks < <(find . -type f -name '*.apk' | sort)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files found in downloaded artifact"
            echo "Full tree of release/:"
            find . -type f | sort
            exit 1
          fi

          {
            echo "files<<__FILES_EOF__"
            for apk in "${apks[@]}"; do
              # Absolute path (PWD == release/ working dir) — works no matter
              # what directory action-gh-release runs from.
              echo "$PWD/${apk#./}"
            done
            echo "__FILES_EOF__"

            echo "body<<__BODY_EOF__"
            echo "Automated release: **${{ env.RELEASE_TAG }}**"
            echo ""
            for apk in "${apks[@]}"; do
              size=$(du -h "$apk" | cut -f1)
              echo "- \`$(basename "$apk")\` (${size})"
            done
            echo "__BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "=== Resolved file list ==="
          for apk in "${apks[@]}"; do echo "$apk"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.meta.outputs.files }}
          name: Release ${{ env.RELEASE_TAG }}
          body: ${{ steps.meta.outputs.body }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
